# Project-scoped Codex config for this repository.
#
# The gga pre-commit hook runs `codex exec` from this working tree, so reviews
# use Pi's tracked default model at the highest reasoning effort. Interactive
# Codex sessions started here inherit these values too; override with `-m` or
# `-c model_reasoning_effort=...` when you want something else.
model = "gpt-6-luna"
model_reasoning_effort = "xhigh"
