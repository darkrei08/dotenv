# Project-scoped Codex config for this repository.
#
# The gga pre-commit hook runs `codex exec` from this working tree, so these
# values are what reviews the staged files: a cheap fast model at the highest
# reasoning effort. Interactive Codex sessions started in this repository
# inherit them too; override with `-m` / `-c model_reasoning_effort=...` when
# you want something else.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
