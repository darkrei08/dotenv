# Listen on all container interfaces; Compose limits host access to 127.0.0.1.
host: "0.0.0.0"
port: 8317

# Provider credentials are stored here, separately from the inbound client API key.
auth-dir: "/root/.cli-proxy-api"

# Replace this placeholder with a private key for clients calling this proxy.
api-keys:
  - "REPLACE_WITH_A_LONG_RANDOM_CLIENT_KEY"

# Keep debug logging disabled.
debug: false

# Optional OpenCode Go subscription credentials. Keep this block only in the
# ignored config.yaml; never commit a real key. The prefix makes the downstream
# model ids explicit, for example `go/deepseek-v4.1-flash`.
# opencode-go-api-key:
#   - name: "opencode-go-primary"
#     api-key: "REPLACE_WITH_A_PRIVATE_OPENCODE_GO_KEY"
#     prefix: "go"
#     # base-url defaults to https://opencode.ai/zen/go/v1
#     # models:
#     #   - name: "deepseek-v4.1-flash"
#     #     alias: "deepseek-v4.1-flash"
#     #     protocol: "openai"
#     #     force-mapping: true
#
# The Management API serves the /management.html panel and CPA Usage Keeper.
# allow-remote is required because Keeper calls from another container; the
# host ports stay bound to 127.0.0.1. Use the same key as CPA_MANAGEMENT_KEY in
# keeper.env. CPA replaces the plaintext key with its hash on first start.
remote-management:
  allow-remote: true
  secret-key: "REPLACE_WITH_A_LONG_RANDOM_MANAGEMENT_KEY"

# Keeper reads usage records from this queue.
usage-statistics-enabled: true

# Require authentication for WebSocket API clients.
ws-auth: true
