name: Automatic release

on:
  push:
    branches:
      - main

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the next patch tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          stable_tags() {
            git tag "$@" --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/'
          }

          current_tag="$(stable_tags --points-at "$GITHUB_SHA" | sort -V | tail -n 1)"
          if [[ -n "$current_tag" ]]; then
            echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
            echo "Commit already has $current_tag; release creation will be idempotent."
            exit 0
          fi

          latest_tag="$(stable_tags | sort -V | tail -n 1)"
          latest_tag="${latest_tag:-v0.0.0}"
          version="${latest_tag#v}"
          IFS=. read -r major minor patch <<< "$version"
          next_tag="v${major}.${minor}.$((patch + 1))"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" "$GITHUB_SHA" -m "$next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
